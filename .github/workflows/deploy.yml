name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나씩만
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 서버 RAM(1GB)이 부족하므로 빌드는 GitHub 호스티드 러너에서 수행
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check photograph safety before packaging
        run: |
          python -m pip install -r scripts/photo-check-requirements.txt
          python scripts/check-photo-safety.py
          python -m unittest discover -s tests -p 'test_photo_safety.py'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Package bundle
        run: bash scripts/package.sh bundle.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.tar.gz
          retention-days: 7

  # 서버(self-hosted runner)에서는 빌드 결과물을 받아 PM2로 실행만 함
  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Extract bundle
        run: |
          rm -rf bundle
          mkdir bundle
          tar -xzf bundle.tar.gz -C bundle
          rm bundle.tar.gz

      - name: Deploy with PM2
        run: bash bundle/deploy.sh bundle
        env:
          GIT_COMMIT: ${{ github.sha }}
          # 러너는 잡 종료 시 자신이 띄운 프로세스를 정리한다.
          # 이 값을 비워야 PM2 데몬이 잡 종료 후에도 살아남는다.
          RUNNER_TRACKING_ID: ""
