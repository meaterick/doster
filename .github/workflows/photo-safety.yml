name: Photo safety

on:
  push:
    branches: [main, "doster/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install image inspection dependency
        run: python -m pip install -r scripts/photo-check-requirements.txt
      - name: Check published photographs
        run: python scripts/check-photo-safety.py
      - name: Test failure detection
        run: python -m unittest discover -s tests -p 'test_photo_safety.py'
